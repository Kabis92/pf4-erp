name: pf4erp

services:
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - pf4erp-mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: pf4erp
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pf4erp

  mongo-express:
    image: mongo-express:1.0.2-20
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - pf4erp
    profiles:
      - tools

  core:
    build:
      context: .
      dockerfile: deploy/Dockerfile.core
    image: pf4erp-core:${IMAGE_TAG:-latest}
    ports:
      - "${CORE_PORT:-8080}:8080"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/pf4erp}
      JWT_SECRET: ${JWT_SECRET:-pf4erp-dev-secret-change-me-32chars!!}
      PLUGIN_RUNTIME_MODE: deployment
      PLUGINS_DIR: /app/plugins
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    volumes:
      # Persiste les JAR (imports admin). Seed automatique si volume vide.
      - pf4erp-plugins:/app/plugins
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - pf4erp
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ui
    image: pf4erp-ui:${IMAGE_TAG:-latest}
    ports:
      - "${UI_PORT:-3000}:80"
    depends_on:
      core:
        condition: service_healthy
    networks:
      - pf4erp
    restart: unless-stopped

volumes:
  pf4erp-mongo-data:
  pf4erp-plugins:

networks:
  pf4erp:
    name: pf4erp-net
